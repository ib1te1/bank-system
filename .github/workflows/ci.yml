name: CI - build, test, coverage, sonar

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    env:
      SERVICES_ROOT: bank-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ensure cache directories exist
        run: |
          mkdir -p ~/.sonar/cache
          mkdir -p ~/.m2/repository

      - name: Cache Sonar and Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.sonar/cache
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Find modules with pom.xml
        id: find-modules
        run: |
          echo "Searching for service modules under $SERVICES_ROOT..."
          modules=""
          for d in $SERVICES_ROOT/*; do
            if [ -f "$d/pom.xml" ]; then
              modules="$modules $d"
            fi
          done
          echo "modules=$modules" >> $GITHUB_OUTPUT

      - name: Build, test, jacoco and sonar per module
        if: steps.find-modules.outputs.modules != ''
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY_BASE: ${{ secrets.SONAR_PROJECT_KEY_BASE }}
        run: |
          set -euo pipefail
          modules="${{ steps.find-modules.outputs.modules }}"
          echo "Modules: $modules"
          for dir in $modules; do
            service=$(basename "$dir")
            echo "=== Module: $service ==="
            # build + tests + jacoco xml
            mvn -B -f "$dir/pom.xml" clean test jacoco:report

            # path to jacoco xml
            JACOCO_XML="$dir/target/site/jacoco/jacoco.xml"
            if [ ! -f "$JACOCO_XML" ]; then
              echo "ERROR: JaCoCo report not found at $JACOCO_XML"
              exit 1
            fi

            # prepare sonar project key
            if [ -n "${SONAR_PROJECT_KEY_BASE:-}" ]; then
              projectKey="${SONAR_PROJECT_KEY_BASE}:${service}"
            else
              projectKey="${{ github.repository }}:${service}"
            fi

            # run sonar analysis
            mvn -B -f "$dir/pom.xml" sonar:sonar \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.login="${SONAR_TOKEN}" \
              -Dsonar.projectKey="${projectKey}" \
              -Dsonar.projectName="${{ github.repository }}-${service}" \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          done
