version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: bank_system
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_user
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/kafka/9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  deal:
    build:
      context: .
      dockerfile: ./deal/Dockerfile
    container_name: deal
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_system
      SPRING_DATASOURCE_USERNAME_FILE: /run/secrets/db_user
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CALCULATOR_API_URL: http://calculator:8081
      STATEMENT_API_URL: http://statement:8082
      DOSSIER_TOPIC: create-documents
    secrets:
      - db_user
      - db_password
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  statement:
    build:
      context: .
      dockerfile: ./statement/Dockerfile
    container_name: statement
    depends_on:
      - deal
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      DEAL_API_URL: http://deal:8080
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  calculator:
    build:
      context: .
      dockerfile: ./calculator/Dockerfile
    container_name: calculator
    depends_on:
      - deal
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: gateway
    depends_on:
      - deal
      - statement
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      DEAL_API_URL: http://deal:8080
      STATEMENT_API_URL: http://statement:8082
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  dossier:
    build:
      context: .
      dockerfile: ./dossier/Dockerfile
    container_name: dossier
    depends_on:
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8000
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_USERNAME_FILE: /run/secrets/mail_user
      MAIL_PASSWORD_FILE: /run/secrets/mail_pass
    secrets:
      - mail_user
      - mail_pass
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  mail_user:
    file: ./secrets/mail_user.txt
  mail_pass:
    file: secrets/mail_pass.txt
